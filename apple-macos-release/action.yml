name: Apple macOS release
description: Plan, retain signed packages, and publish one source-bound macOS release through a product adapter.
inputs:
  registry-url:
    description: npm registry for tool bootstrap and engine dependencies; defaults to the GitHub-hosted runner registry.
    default: https://registry.npmjs.org/
  phase:
    description: plan, build or publish. Tags are created only during publish.
    required: true
  profile:
    description: preview-only, preview-stable or maintenance.
    default: preview-only
  source-mode:
    description: ci for a verified CI dispatch, or push for a main push checked by the build adapter.
    default: ci
  ci-workflow:
    description: Official CI workflow filename.
    default: ci.yml
  ci-run-id:
    description: Successful official push CI run ID, empty for a checked main push.
  source-sha:
    description: The source-sha output of the original plan phase.
  plan-artifact:
    description: Unique plan artifact name in this workflow.
    default: apple-macos-release-plan
  signed-artifact:
    description: Unique signed package artifact name in this workflow.
    default: apple-macos-signed-packages
  artifact-directory:
    description: Dedicated directory containing validated-artifacts.json and its named files.
    default: dist
  preview-signing:
    description: ad-hoc or developer-id; stable always requires developer-id.
    default: ad-hoc
  credentials:
    description: JSON of explicitly mapped product credentials, passed only to the build or publish adapter.
    default: '{}'
  settings:
    description: JSON of non-secret product settings.
    default: '{}'
  token:
    description: Workflow token for source, artifact and publication operations.
    default: ${{ github.token }}
  install-engine:
    description: Install the public semantic engine for an adapter using planUnit.
    default: 'false'
outputs:
  release:
    description: Whether this run has a release.
    value: ${{ steps.plan.outputs.release }}
  tag:
    description: Immutable planned tag.
    value: ${{ steps.plan.outputs.tag }}
  version:
    description: Planned product version.
    value: ${{ steps.plan.outputs.version }}
  channel:
    description: Planned channel.
    value: ${{ steps.plan.outputs.channel }}
  source-sha:
    description: Tested source.
    value: ${{ steps.source.outputs.source-sha }}
  branch:
    description: Tested branch.
    value: ${{ steps.source.outputs.branch }}
runs:
  using: composite
  steps:
    - name: Configure the common release contract
      shell: bash
      env:
        APPLE_ROOT: ${{ github.action_path }}
        APPLE_PHASE: ${{ inputs.phase }}
        APPLE_PROFILE: ${{ inputs.profile }}
        APPLE_PREVIEW_SIGNING: ${{ inputs.preview-signing }}
        APPLE_DIRECTORY: ${{ inputs.artifact-directory }}
        APPLE_CI_RUN: ${{ inputs.ci-run-id }}
      run: |
        case "$APPLE_PHASE" in plan|build|publish) ;; *) exit 1 ;; esac
        case "$APPLE_PROFILE" in preview-only|preview-stable|maintenance) ;; *) exit 1 ;; esac
        case "$APPLE_PREVIEW_SIGNING" in ad-hoc|developer-id) ;; *) exit 1 ;; esac
        [[ -z "$APPLE_CI_RUN" || "$APPLE_CI_RUN" =~ ^[1-9][0-9]*$ ]]
        [[ "$APPLE_DIRECTORY" =~ ^[a-zA-Z0-9_-]+(/[a-zA-Z0-9_-]+)*$ ]]
        {
          printf 'APPLE_RELEASE_TOOLS=%s\n' "$APPLE_ROOT"
          printf 'APPLE_PROFILE=%s\nAPPLE_PREVIEW_SIGNING=%s\n' "$APPLE_PROFILE" "$APPLE_PREVIEW_SIGNING"
          printf 'APPLE_STABLE_SIGNING=developer-id\n'
          printf 'APPLE_ARTIFACT_DIRECTORY=%s\nRELEASE_ARTIFACTS=%s\n' "$APPLE_DIRECTORY" "$APPLE_DIRECTORY"
          printf 'RELEASE_PLAN=target/release-plan/plan.json\nCI_RUN_ID=%s\n' "$APPLE_CI_RUN"
        } >> "$GITHUB_ENV"
    - if: inputs.phase == 'plan'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '26.13.0'
        package-manager-cache: false
    - if: inputs.phase == 'plan'
      id: source
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        APPLE_SOURCE_MODE: ${{ inputs.source-mode }}
        APPLE_CI_WORKFLOW: ${{ inputs.ci-workflow }}
      run: node "$APPLE_RELEASE_TOOLS/../release/src/apple-pipeline.mjs" source
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.phase == 'plan' && steps.source.outputs.source-sha || inputs.source-sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Export the tested source
      shell: bash
      env:
        APPLE_SHA: ${{ inputs.phase == 'plan' && steps.source.outputs.source-sha || inputs.source-sha }}
      run: |
        printf 'SOURCE_SHA=%s\nRELEASE_BRANCH=%s\n' "$APPLE_SHA" "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
    - if: inputs.phase == 'plan' && inputs.install-engine == 'true'
      id: tooling
      shell: bash
      run: |
        node --input-type=module <<'JS'
        import { appendFileSync } from 'node:fs';
        import { relative, resolve } from 'node:path';
        appendFileSync(process.env.GITHUB_OUTPUT, `package-json=${relative(process.env.GITHUB_WORKSPACE, resolve(process.env.APPLE_RELEASE_TOOLS, '../package.json'))}\n`);
        JS
    - if: inputs.phase == 'plan' && inputs.install-engine == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      env:
        npm_config_registry: ${{ inputs.registry-url }}
      with:
        version: '10.34.9'
        cache: false
        package_json_file: ${{ steps.tooling.outputs.package-json }}
    - if: inputs.phase == 'plan' && inputs.install-engine == 'true'
      shell: bash
      env:
        npm_config_registry: ${{ inputs.registry-url }}
      run: pnpm --dir "$APPLE_RELEASE_TOOLS/.." install --frozen-lockfile --ignore-scripts
    - uses: ./.github/actions/apple-macos-release
      env:
        npm_config_registry: ${{ inputs.registry-url }}
      with:
        phase: setup
        settings: ${{ inputs.settings }}
    - if: inputs.phase == 'plan'
      id: saved-plan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        APPLE_FIND_ARTIFACT: ${{ inputs.plan-artifact }}
      run: node "$APPLE_RELEASE_TOOLS/../release/src/apple-pipeline.mjs" find
    - if: inputs.phase == 'plan' && steps.saved-plan.outputs.exists == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.saved-plan.outputs.id }}
        path: target/release-plan
    - if: inputs.phase != 'plan'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.plan-artifact }}
        path: target/release-plan
    - if: inputs.phase == 'plan' && steps.saved-plan.outputs.exists != 'true'
      uses: ./.github/actions/apple-macos-release
      env:
        GH_TOKEN: ${{ inputs.token }}
      with:
        phase: plan
        settings: ${{ inputs.settings }}
    - id: plan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        APPLE_STABLE_SIGNING: developer-id
        APPLE_PREVIEW_SIGNING: ${{ inputs.preview-signing }}
      run: node "$APPLE_RELEASE_TOOLS/../release/src/apple-pipeline.mjs" plan
    - if: inputs.phase == 'plan' && steps.plan.outputs.release == 'true' && steps.saved-plan.outputs.exists != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.plan-artifact }}
        path: target/release-plan/plan.json
        if-no-files-found: error
        retention-days: 90
    - if: inputs.phase != 'plan'
      uses: ./.github/actions/apple-macos-release
      with:
        phase: env
        settings: ${{ inputs.settings }}
    - if: inputs.phase == 'build'
      id: saved
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        APPLE_FIND_ARTIFACT: ${{ inputs.signed-artifact }}
      run: node "$APPLE_RELEASE_TOOLS/../release/src/apple-pipeline.mjs" find
    - if: inputs.phase == 'build' && steps.saved.outputs.exists == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.saved.outputs.id }}
        path: ${{ inputs.artifact-directory }}
    - if: inputs.phase == 'publish'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.signed-artifact }}
        path: ${{ inputs.artifact-directory }}
    - if: inputs.phase == 'build' && steps.saved.outputs.exists != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        APPLE_STABLE_SIGNING: developer-id
        APPLE_PREVIEW_SIGNING: ${{ inputs.preview-signing }}
      run: node "$APPLE_RELEASE_TOOLS/../release/src/apple-pipeline.mjs" guard
    - if: inputs.phase == 'build' && steps.saved.outputs.exists != 'true'
      uses: ./.github/actions/apple-macos-release
      env:
        GH_TOKEN: ${{ inputs.token }}
        npm_config_registry: ${{ inputs.registry-url }}
      with:
        phase: build
        credentials: ${{ inputs.credentials }}
        settings: ${{ inputs.settings }}
    - if: inputs.phase != 'plan'
      uses: ./.github/actions/apple-macos-release
      with:
        phase: verify
        settings: ${{ inputs.settings }}
    - if: inputs.phase != 'plan'
      id: verified
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        APPLE_STABLE_SIGNING: developer-id
        APPLE_PREVIEW_SIGNING: ${{ inputs.preview-signing }}
      run: node "$APPLE_RELEASE_TOOLS/../release/src/apple-pipeline.mjs" verify
    - if: inputs.phase == 'build' && steps.saved.outputs.exists != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.signed-artifact }}
        path: ${{ steps.verified.outputs.paths }}
        include-hidden-files: true
        if-no-files-found: error
        compression-level: 0
        retention-days: 90
    - if: inputs.phase == 'publish'
      uses: ./.github/actions/apple-macos-release
      env:
        GH_TOKEN: ${{ inputs.token }}
      with:
        phase: publish
        credentials: ${{ inputs.credentials }}
        settings: ${{ inputs.settings }}
