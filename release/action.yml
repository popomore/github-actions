name: Release
description: Plan scoped Conventional Commit releases and create immutable source-bound tags.
inputs:
  manifest-directory:
    description: Source-controlled release-unit directory.
  manifest:
    description: One source-controlled release unit instead of a directory.
  exclude-units:
    description: JSON list of units handled by another explicitly gated step.
    default: '[]'
  dry-run:
    description: Plan without GitHub writes; PR validation needs no release token.
    default: 'true'
  tag-token:
    description: Dedicated App/PAT for tag-push workflows; no GITHUB_TOKEN fallback.
  receipt-file:
    description: Optional receipt path.
outputs:
  tag:
    description: Planned tag when exactly one unit releases.
    value: ${{ steps.release.outputs.tag }}
  tags:
    description: JSON list of planned tags.
    value: ${{ steps.release.outputs.tags }}
  version:
    description: Semantic version when exactly one unit releases.
    value: ${{ steps.release.outputs.version }}
  status:
    description: disabled, unchanged, verified, created or exists.
    value: ${{ steps.release.outputs.status }}
  created:
    description: Whether a tag was created.
    value: ${{ steps.release.outputs.created }}
  source-sha:
    description: Exact checked-out source SHA.
    value: ${{ steps.release.outputs.source-sha }}
  receipt:
    description: Batch release receipt path.
    value: ${{ steps.release.outputs.receipt }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '26.13.0'
        package-manager-cache: false
    - name: Locate the tooling manifest
      id: tooling
      shell: bash
      env:
        RELEASE_ACTION_ROOT: ${{ github.action_path }}/..
      run: |
        node --input-type=module <<'JS'
        import { appendFileSync } from 'node:fs';
        import { relative, resolve } from 'node:path';
        appendFileSync(process.env.GITHUB_OUTPUT, `package-json=${relative(process.env.GITHUB_WORKSPACE, resolve(process.env.RELEASE_ACTION_ROOT, 'package.json'))}\n`);
        JS
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: '10.34.9'
        package_json_file: ${{ steps.tooling.outputs.package-json }}
        cache: false
    - name: Install the pinned release engine
      shell: bash
      env:
        RELEASE_ACTION_ROOT: ${{ github.action_path }}/..
        npm_config_registry: https://registry.npmjs.org/
      run: pnpm --dir "$RELEASE_ACTION_ROOT" install --frozen-lockfile --ignore-scripts
    - id: release
      shell: bash
      env:
        RELEASE_ACTION_ROOT: ${{ github.action_path }}/..
        RELEASE_MANIFEST_DIRECTORY: ${{ inputs.manifest-directory }}
        RELEASE_MANIFEST: ${{ inputs.manifest }}
        RELEASE_EXCLUDE_UNITS: ${{ inputs.exclude-units }}
        RELEASE_DRY_RUN: ${{ inputs.dry-run }}
        RELEASE_TAG_TOKEN: ${{ inputs.tag-token }}
        RELEASE_RECEIPT_FILE: ${{ inputs.receipt-file }}
        RELEASE_IMPLEMENTATION_REF: ${{ github.action_ref }}
      run: node "$RELEASE_ACTION_ROOT/release/src/action.mjs"
